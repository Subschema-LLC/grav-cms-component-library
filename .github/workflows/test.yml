name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grav:
    name: Grav ${{ matrix.grav }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grav: ['2.2.11', '1.7.53']
    steps:
      - uses: actions/checkout@v4
        with:
          path: library

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, mbstring, curl, xml, intl
          tools: composer

      - name: Install Grav ${{ matrix.grav }}
        run: |
          git clone --depth 1 --branch "${{ matrix.grav }}" https://github.com/getgrav/grav grav
          cd grav
          composer install --no-dev --no-interaction --prefer-dist
          mkdir -p logs cache tmp images assets backup

      - name: Validate, check the catalog, render the fixture site
        run: library/tests/run.sh "$GITHUB_WORKSPACE/grav" 8765

      - name: Server log on failure
        if: failure()
        run: tail -100 grav/logs/cl-test-server.log grav/logs/grav.log || true
