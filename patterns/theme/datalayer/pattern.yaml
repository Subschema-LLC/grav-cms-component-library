id: theme/datalayer
name: Data layer
version: 1.1.0
level: theme
status: stable
summary: A site-agnostic window.dataLayer helper loaded in the head, configured from theme settings through a JSON block, with declarative data-datalayer-event attributes instead of inline scripts.
use_when:
  - The site uses a tag manager (GTM, a self-hosted TMS) that reads window.dataLayer.
  - Templates need to report events such as "map_view" or "weather_view".
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  plugins: [component-library]
data:
  scope: theme
  keys:
    datalayer.enabled: { type: bool }
    datalayer.app: { type: string, description: "customData.app; default site.title" }
    datalayer.env: { type: string, description: "Free text, such as production, staging, development (or an existing value like PROD)" }
    datalayer.collection_method: { type: string }
files:
  blueprint: blueprint.yaml
  template: datalayer.html.twig
  assets: [datalayer.js]
apply:
  blueprint: |
    scripts_section:
      type: section
      title: Tracking & Scripts
      underline: true
      import@1:
        type: theme/datalayer/blueprint
        context: 'plugin://component-library/patterns'
      import@2:
        type: theme/head-scripts/blueprint
        context: 'plugin://component-library/patterns'
  template: |
    {% block javascripts %}
        {% include 'patterns/theme/datalayer/datalayer.html.twig' %}
        ...
    {% endblock %}

    {# Emit an event when an element is on the page: #}
    <div id="map" data-datalayer-event="map_view"></div>
  config: |
    # user/env/staging.example.com/config/themes/<theme>.yaml
    datalayer:
      env: staging
solves:
  - problem: The data layer script hard-coded the app name and "PROD", so staging and local traffic was reported as production and the file had to be edited per site.
    fix: App name and environment come from theme settings (overridable per environment folder) through a JSON config block.
    seen_in: community-guide theme
  - problem: The script loaded at the bottom of the page, so tags in the head pushed events before dataLayer helpers existed.
    fix: Registered in the head asset group at high priority.
    seen_in: community-guide theme, "move dataLayer.js to the head"
  - problem: Each template added its own inline snippet to fire an event, and those had to be rewritten twice to wait for DOMContentLoaded.
    fix: Templates add data-datalayer-event="name"; the script emits each name once when the DOM is ready. No inline JavaScript, which also keeps a strict Content-Security-Policy possible.
    seen_in: community-guide theme, weather_view and map_view tracking
verify:
  - The page head contains datalayer.js and a #cl-datalayer-config JSON block.
  - In the browser console, window.dataLayer contains a "metadata" event after load, and one event per distinct data-datalayer-event name.
