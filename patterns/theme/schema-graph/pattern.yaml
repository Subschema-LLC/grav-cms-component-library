id: theme/schema-graph
name: Schema.org graph
version: 1.0.0
level: theme
touches: [page]
status: stable
summary: One linked JSON-LD @graph per page (Organization, WebSite, BreadcrumbList, the page, plus BlogPosting and Place when they apply), with site-wide defaults in the theme and a per-page Schema.org tab.
use_when:
  - Any public site; search engines and AI crawlers read JSON-LD.
avoid_when:
  - An SEO plugin already outputs the same entities (two Organization nodes with different @id values confuse parsers). Pick one source.
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  patterns: [theme/site-logo, theme/author-registry, page/map-location]
data:
  scope: theme
  keys:
    schema_defaults.organization_type: { type: string }
    schema_defaults.organization_name: { type: string }
    schema_defaults.telephone: { type: string }
    schema_defaults.address_locality: { type: string }
    schema_defaults.address_region: { type: string }
    schema_defaults.postal_code: { type: string }
    schema_defaults.address_country: { type: "ISO 3166-1 alpha-2" }
    schema_defaults.home_about: { type: map, description: "name, description, latitude, longitude" }
    page.header.schema:
      type: map
      item:
        enabled: bool
        type: "auto | WebPage | AboutPage | ContactPage | CollectionPage | ItemPage | FAQPage | BlogPosting"
        name: string
        description: string
        image: media filename, path or URL
        place_type: Schema.org Place subtype
        place_name: string
        place_description: string
        latitude: number
        longitude: number
        telephone: string
        street_address: string
        address_locality: string
        address_region: string
        postal_code: string
        author_name: string
        author_url: string
        date_published: datetime
        custom_json: JSON object
legacy_keys:
  - key: page.header.schema_type
    handling: Not read. Move the value to schema.type.
files:
  blueprint: blueprint.yaml
  template: schema-graph.html.twig
  snippets: [page.yaml]
  example: example.md
apply:
  blueprint: |
    # theme blueprints.yaml
    schema_section:
      type: section
      title: Structured Data
      underline: true
      import@:
        type: theme/schema-graph/blueprint
        context: 'plugin://component-library/patterns'

    # page blueprint: its own tab
    schema:
      type: tab
      title: Schema.org
      import@:
        type: theme/schema-graph/page
        context: 'plugin://component-library/patterns'
  template: |
    {# in <head> #}
    {% include 'patterns/theme/schema-graph/schema-graph.html.twig' with {
        page_types: { contact: 'ContactPage', blog: 'CollectionPage' },
        article_templates: ['item', 'blogpost']
    } %}
solves:
  - problem: The JSON-LD partial hard-coded one site's town, region, postal code, coordinates and organization name, so it was wrong on any other site and the address defaults could not be changed without editing Twig.
    fix: Site-wide defaults (publisher type and name, address defaults, home-page subject) are theme settings.
    seen_in: community-guide theme, Schema.org work
  - problem: Older Gantry particles wrote Product JSON-LD with a hard-coded brand and seller name, and added Open Graph tags with JavaScript, which most crawlers never run.
    fix: Names come from settings; social meta belongs in server-rendered <meta> tags (page.header.metadata), never in JavaScript.
    seen_in: Gantry schema particle
  - problem: Values were printed into JSON by hand inside a script tag, so a "</script>" in any field could end the tag early.
    fix: The whole graph is built as a Twig hash and printed once with json_encode(321), which includes JSON_HEX_TAG.
    seen_in: Gantry schema particle (fixed in the community-guide rewrite)
  - problem: The Map page's ItemList listed only the extra markers, not the pages carrying a Map Location, so structured data disagreed with the visible list.
    fix: The map page type outputs its own ItemList from the same list it renders (page-type/map-page); this graph links to it by #webpage.
    seen_in: community-guide theme, map page
  - problem: Page images in the JSON-LD were relative paths, because media url(true) does not add the host (its argument means "reset").
    fix: url(page.media[file].url, true).
    seen_in: community-guide theme, Schema.org partial
  - problem: The Organization logo URL broke when the logo storage moved.
    fix: Reads theme/site-logo's field, with the legacy picker as fallback.
  - problem: An author override and the author registry disagreed on precedence.
    fix: schema.author_name, then the registry entry for page.header.author, then site.author.name.
verify:
  - Exactly one application/ld+json script with an @graph is in <head>.
  - Paste the page into the Schema Markup Validator (validator.schema.org) with no errors.
  - Setting schema.enabled false on a page removes the block.
