# Pattern: theme/schema-graph — page blueprint fragment (per-page overrides)
# Usually its own tab:
#   schema:
#     type: tab
#     title: Schema.org
#     import@:
#       type: theme/schema-graph/page
#       context: 'plugin://component-library/patterns'
form:
  fields:
    header_schema_general:
      cl_pattern: theme/schema-graph
      type: section
      title: Structured Data
      text: Schema.org JSON-LD for search engines. Every field is optional; empty fields fall back to the page's own title, description and images.
      underline: true

    header.schema.enabled:
      cl_pattern: theme/schema-graph
      type: toggle
      label: Output Structured Data
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header.schema.type:
      cl_pattern: theme/schema-graph
      type: select
      label: Page Type
      help: Auto picks a type from the page template.
      default: auto
      options:
        auto: Auto (from the template)
        WebPage: WebPage
        AboutPage: AboutPage
        ContactPage: ContactPage
        CollectionPage: CollectionPage (a listing)
        ItemPage: ItemPage (one item)
        FAQPage: FAQPage
        BlogPosting: BlogPosting (an article or story)

    header.schema.name:
      cl_pattern: theme/schema-graph
      type: text
      label: Name or Headline
      help: Defaults to the SEO title, then the page title.

    header.schema.description:
      cl_pattern: theme/schema-graph
      type: textarea
      rows: 2
      label: Description
      help: Defaults to the meta description, then the page summary.

    header.schema.image:
      cl_pattern: theme/schema-graph
      type: text
      label: Image
      help: A page media filename, a site path or a full URL. Defaults to the header image.

    header_schema_place:
      cl_pattern: theme/schema-graph
      type: section
      title: Place
      text: When the page describes a place. Coordinates fall back to the page's Map Location.
      underline: true

    header.schema.place_type:
      cl_pattern: theme/schema-graph
      type: select
      label: Place Type
      default: Place
      options:
        Place: Place
        LocalBusiness: Local business
        Restaurant: Restaurant or bar
        Store: Store
        LodgingBusiness: Lodging
        Campground: Campground
        Park: Park
        TouristAttraction: Tourist attraction
        TouristDestination: Tourist destination
        CivicStructure: Civic or community building
        PlaceOfWorship: Place of worship
        Church: Church
        Museum: Museum
        GasStation: Gas station

    header.schema.place_name:
      cl_pattern: theme/schema-graph
      type: text
      label: Place Name
      help: Defaults to the Map Location title, then the page title.

    header.schema.place_description:
      cl_pattern: theme/schema-graph
      type: textarea
      rows: 2
      label: Place Description

    header.schema.latitude:
      cl_pattern: theme/schema-graph
      type: text
      label: Latitude
      validate:
        type: number
        min: -90
        max: 90

    header.schema.longitude:
      cl_pattern: theme/schema-graph
      type: text
      label: Longitude
      validate:
        type: number
        min: -180
        max: 180

    header.schema.telephone:
      cl_pattern: theme/schema-graph
      type: text
      label: Phone
      placeholder: '+1-555-555-0100'

    header.schema.street_address:
      cl_pattern: theme/schema-graph
      type: text
      label: Street Address

    header.schema.address_locality:
      cl_pattern: theme/schema-graph
      type: text
      label: City or Town
      help: Defaults to the theme's default city.

    header.schema.address_region:
      cl_pattern: theme/schema-graph
      type: text
      label: State or Region

    header.schema.postal_code:
      cl_pattern: theme/schema-graph
      type: text
      label: Postal Code

    header_schema_article:
      cl_pattern: theme/schema-graph
      type: section
      title: Article
      text: When the page is a story or article.
      underline: true

    header.schema.author_name:
      cl_pattern: theme/schema-graph
      type: text
      label: Author Name
      help: Defaults to the page's author from the author registry, then the site author.

    header.schema.author_url:
      cl_pattern: theme/schema-graph
      type: text
      label: Author URL

    header.schema.date_published:
      cl_pattern: theme/schema-graph
      type: datetime
      label: Date Published
      help: Defaults to the page date.

    header_schema_advanced:
      cl_pattern: theme/schema-graph
      type: section
      title: Custom JSON-LD
      underline: true

    header.schema.custom_json:
      cl_pattern: theme/schema-graph
      type: textarea
      rows: 5
      label: Extra JSON
      help: "A JSON object. With an @type it is added to the graph as its own entity; without one its properties are merged into the page entity. Invalid JSON is ignored."
      placeholder: '{"sameAs": ["https://example.com/profile"]}'
