id: theme/map-here
name: HERE map with conditional loading
version: 1.0.0
level: theme
touches: [page]
status: stable
summary: HERE Maps settings in the theme, a loader that adds the map scripts only on pages that show a map, and a map script that reads its settings from JSON and supports linked markers.
use_when:
  - Some pages show an interactive map and most do not.
  - Maps should be editable by putting <div id="map"></div> in content, without Twig.
avoid_when:
  - Every page shows a map (load the scripts unconditionally).
  - A static map image is enough.
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  plugins: [component-library]
data:
  scope: theme
  keys:
    here_map.api_key: { type: string, description: Public by design; restrict it to the site's domains in the HERE console. }
    here_map.latitude: { type: number }
    here_map.longitude: { type: number }
    here_map.zoom: { type: int }
    here_map.label: { type: string }
    here_map.legacy_globals: { type: bool }
    page.header.map_enabled: { type: bool }
    page.header.here_map: { type: map, description: "Per-page overrides: latitude, longitude, zoom", frontmatter_only: true }
files:
  blueprint: blueprint.yaml
  template: map-here.html.twig
  snippets: [page.yaml]
  assets: [map-here.js]
apply:
  blueprint: |
    # theme blueprints.yaml
    map_section:
      type: section
      title: Map
      underline: true
      import@:
        type: theme/map-here/blueprint
        context: 'plugin://component-library/patterns'

    # page blueprint
    page_options:
      type: tab
      title: Page Options
      import@:
        type: theme/map-here/page
        context: 'plugin://component-library/patterns'
  template: |
    {% block javascripts %}
        {% include 'patterns/theme/map-here/map-here.html.twig' with { map_templates: ['map'] } %}
    {% endblock %}

    {# In page content (Markdown), no Twig needed: #}
    <div id="map" data-lat="44.98" data-lng="-93.27" data-zoom="14"></div>
classes:
  markup: [cl-map-bubble, cl-map-bubble__title, cl-map-bubble__summary]
  slots: []
solves:
  - problem: Maps centered on Europe because the HERE default center was used when no center was passed.
    fix: The script uses the theme's default center; with none it fits the markers, or shows the world with a console warning instead of a misleading region.
    seen_in: community-guide theme, v0.2.0
  - problem: The four HERE scripts and stylesheet loaded on every page.
    fix: The loader adds them only for map templates, map_enabled pages, or pages whose content, tiles, CTA rows or modular sections contain id="map".
    seen_in: community-guide theme
  - problem: The API key, center and zoom were hard-coded in JavaScript.
    fix: Theme settings, passed through a JSON block; per-page here_map overrides and per-element data-lat, data-lng and data-zoom.
    seen_in: community-guide theme
  - problem: After the map script was rewritten, older inline scripts that called map.addObject() failed with "map.addObject is not a function", because the global map no longer existed and "map" resolved to the <div id="map"> element.
    fix: An opt-in Legacy Map Globals setting restores window.map, platform, ui, behavior, defaultLayers and moveMap. The default center pin is skipped when another script added objects.
    seen_in: community-guide theme, fix/map-globals
  - problem: The map had no accessible name.
    fix: role="region" plus a configurable aria-label.
  - problem: Animated panning ignored the visitor's reduced-motion setting.
    fix: prefers-reduced-motion turns animation off.
verify:
  - A page without a map has no js.api.here.com requests.
  - A page with <div id="map"></div> in its content loads mapsjs-core.js and has a #cl-map-config JSON block with apiKey set.
  - With no API key, the browser console says so and the page has no script errors.
