id: system/template-hygiene
name: Twig template hygiene for Grav 2
version: 1.0.0
level: system
touches: [theme, page]
status: stable
summary: The template rules every pattern here follows, checkable on any theme with `bin/plugin component-library lint <path>`.
use_when:
  - Writing or reviewing any theme or plugin template.
  - Moving a theme to Grav 2 (Twig 3, twig3_compat off).
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  plugins: [component-library]
files:
  snippets: [rules.md]
apply:
  php: |
    # From the Grav root, against a theme or plugin folder:
    bin/plugin component-library lint user/themes/mytheme
solves:
  - problem: Page titles were printed as {{ page.header.title }} with no filter, flagged by code scanning in two templates. Grav's autoescape covered them, but only for as long as autoescape stays on (twig2_compat turns it off).
    fix: Escape every stored value explicitly with |e; |markdown for markdown fields; |raw only for documented trusted-HTML fields. (lint rule unescaped-header, a warning)
    seen_in: community-guide theme, code-scanning fixes
  - problem: A logout link "commented out" with <!-- --> still rendered a security nonce into every page, because Twig runs inside HTML comments.
    fix: Comment out Twig with {# #}. (lint rule twig-in-html-comment)
    seen_in: community-guide theme, v0.2.0
  - problem: A template had two {% extends %} tags and failed with "Multiple extends tags are forbidden", taking the password-reset page down.
    fix: One extends per template, as its first tag. (lint rule multiple-extends)
    seen_in: community-guide theme, v0.2.0
  - problem: A doc comment containing {# ... #} ended the comment early and printed the rest of it on the page.
    fix: Twig comments do not nest; write notes inside comments with "--" instead. (lint rule nested-comment)
    seen_in: this library's own first draft
  - problem: Trusted-HTML settings were read with theme_var(), which lets page front matter override them, then printed with |raw.
    fix: Read trusted fields with grav.config.get('theme.<key>'). (lint rule theme-var-raw)
    seen_in: library review of the community-guide footer and head templates
  - problem: Links opening a new tab lacked rel="noopener noreferrer". (lint rule blank-without-rel)
    fix: Use cl.link_attrs or add the rel attribute.
    seen_in: community-guide theme
  - problem: JSON inside <script> tags was printed with plain json_encode, so a "</script>" in any value could end the tag.
    fix: json_encode with JSON_HEX_TAG (any flags value with bit 1 set, such as 15 or 321). (lint rule json-without-hex-tag)
    seen_in: Gantry schema particle
  - problem: Templates used Twig 1/2 syntax removed in Twig 3, such as {% filter %}, {% spaceless %} or "for ... if", and only worked with twig3_compat on.
    fix: "{% apply %}, the spaceless filter, and an {% if %} inside the loop; test with twig3_compat: false. (lint rule twig1-syntax)"
    seen_in: Grav 2 migration
  - problem: Structured-data image URLs were built with page.media[file].url(true), expecting an absolute URL; media url()'s argument means "reset", so the JSON-LD carried relative paths.
    fix: url(page.media[file].url, true) adds the scheme and host. (lint rule media-url-true)
    seen_in: community-guide theme, Schema.org partial (found while testing this library on Grav 2.2.11)
verify:
  - bin/plugin component-library lint <theme folder> reports no errors.
  - The theme renders with system.strict_mode.twig3_compat false.
