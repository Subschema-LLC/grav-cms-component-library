id: system/twig-in-content
name: Twig in page content on Grav 2
version: 1.0.0
level: system
touches: [page]
status: stable
summary: Keep Twig out of page content by moving dynamic parts into header fields and templates; when content Twig is genuinely needed, widen the sandbox narrowly in security.yaml or from a plugin.
use_when:
  - Migrating a site whose Markdown contains {{ }} or {% %}.
  - A page shows raw Twig, or a security.log "sandbox blocked" entry, after moving to Grav 2.
compatibility:
  grav: ['2.0']
  tested: ['2.2.11']
files:
  snippets: [security-snippet.yaml, SandboxPolicy.php]
apply:
  config: |
    # user/config/security.yaml: widen, never disable the sandbox
    twig_sandbox:
      allowed_functions: [my_safe_function]
  php: |
    // Plugin: allow its own safe function inside page content
    public function onBuildTwigSandboxPolicy(Event $event): void
    {
        $functions = $event['functions'];
        $functions[] = 'example_gallery';
        $event['functions'] = $functions;
    }
solves:
  - problem: After migrating to Grav 2, pages with Twig in their Markdown showed raw {{ ... }} (before 2.0.19 content Twig was off by default) or had expressions silently blocked by the sandbox.
    fix: Move the dynamic part into a header field and render it from the template (page/embed-block, page/tiles, page/map-location), so no Twig runs in content. Admin's Tools → Reports → Twig in Content lists affected pages.
    seen_in: Grav 2 migration
  - problem: Building embeds and maps with Twig in content mixed presentation into writing and let any page editor run template code.
    fix: Header fields plus templates; editors fill in values, templates decide markup.
    seen_in: community-guide theme (maps via <div id="map">, no Twig)
  - problem: A site copied the whole default sandbox list into security.yaml to add one function, freezing it against later core security fixes (lists merge by replacement).
    fix: In Grav 2.2 the allowed_* keys are additive over built-in defaults; add only your entry. Tighten with denied_*.
    seen_in: Grav 2 security configuration changes
  - problem: Turning the sandbox off to make one page work removed SSTI protection for every editor-written page.
    fix: Leave twig_sandbox.enabled true; allow the specific member instead.
verify:
  - Admin → Tools → Reports → Twig in Content shows no pages leaking raw Twig.
  - logs/security.log has no new sandbox-blocked entries after visiting the affected pages.
