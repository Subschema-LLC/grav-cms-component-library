id: system/dynamic-options
name: Dynamic select options (data-options@)
version: 1.0.0
level: system
touches: [page, theme]
status: stable
summary: Build a select's options from site data with data-options@ and a static provider on the theme or plugin class, registered for Grav 2's provider allowlist.
use_when:
  - A dropdown lists things that live elsewhere (authors, categories, locations) and must not drift from them.
avoid_when:
  - The options are fixed and few; list them in the blueprint.
  - The options are pages; use the pages field type.
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11']
requires:
  php: true
files:
  snippets: [OptionsProvider.php]
apply:
  blueprint: |
    header.category:
      type: select
      label: Category
      default: ''
      data-options@: '\Grav\Theme\Mytheme::categoryOptions'
  php: |
    // In onThemeInitialized (theme) or onPluginsInitialized (plugin), not behind isAdmin():
    if (method_exists(\Grav\Common\Data\Blueprint::class, 'addAllowedDynamicCallable')) {
        \Grav\Common\Data\Blueprint::addAllowedDynamicCallable(self::class . '::categoryOptions');
    }
solves:
  - problem: Option lists copied into page blueprints (author names, for example) drifted from the data they described, and differed between themes.
    fix: The provider reads the data each time the form opens.
    seen_in: community-guide and Gantry child themes (author select)
  - problem: A select's default was a value that none of its options used, so new pages started with an unsaved, invalid choice.
    fix: The provider always returns an explicit empty choice, and the blueprint default is ''.
    seen_in: Gantry child theme page blueprint
  - problem: Grav 2.0.11 and later refuse Class::method providers that are not on the allowlist in some code paths, and registering them behind isAdmin() misses Admin2's API requests.
    fix: Blueprint::addAllowedDynamicCallable() on every request, guarded with method_exists for Grav 1.7.
    seen_in: Grav 2 Admin2 migration
  - problem: A provider in a separate class needed a composer.json and autoloader just for one method.
    fix: A public static method on the theme or plugin class, which Grav already loads.
verify:
  - GET /api/v1/blueprints/pages/<template> lists the provider's options on the field.
  - In Admin2, adding an item to the source data shows it in the dropdown without editing the blueprint.
