id: page/cta-rows
name: Call-to-action rows
version: 1.1.0
level: page
status: stable
summary: Editor-managed full-width rows, each with a heading, markdown text, an optional image and one button.
use_when:
  - A page needs a few promotional or "next step" sections the editor can add, reorder and remove.
  - Each section has at most one primary action.
avoid_when:
  - Content is a grid of equal cards; use page/tiles.
  - The page needs a list of many plain links; use page/quick-actions.
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  patterns: [_shared/macros]
data:
  scope: page.header
  keys:
    info_cta_section:
      type: list
      item:
        title: string
        content: markdown
        cta_section_image: "bool (default on): show the image"
        cta_section_image_file: page media filename
        cta_section_image_alt: string (empty = decorative)
        button_text: string
        button_link: path or URL
        button_new_tab: "_self | _blank"
legacy_keys:
  - key: info_cta_section.*.contentid
    handling: Ignored. Rows render in list order; the cid0–cid10 position select is gone.
files:
  blueprint: blueprint.yaml
  template: cta-rows.html.twig
  example: example.md
apply:
  blueprint: |
    # In a page blueprint, on the tab (or section) that should hold the rows:
    content_blocks:
      type: tab
      title: Content Blocks
      import@:
        type: page/cta-rows/blueprint
        context: 'plugin://component-library/patterns'
  template: |
    {% include 'patterns/page/cta-rows/cta-rows.html.twig' with {
        heading_level: 2,
        classes: { button: 'button is-primary is-large' }
    } %}
classes:
  markup: [cl-cta-rows, cl-cta-rows__row, cl-cta-rows__row--media, cl-cta-rows__row--single, cl-cta-rows__text, cl-cta-rows__heading, cl-cta-rows__body, cl-cta-rows__action, cl-cta-rows__button, cl-cta-rows__media]
  slots: [root, row, heading, body, button, media]
solves:
  - problem: A row whose image file was renamed or deleted threw an error or left an empty image wrapper.
    fix: The template looks the file up in page.media and renders the media column only when it exists.
    seen_in: community-guide theme, v0.2.0
  - problem: An editor who cleared the alt field for a decorative image still got the row title read out as alt text.
    fix: Alt falls back to the title only when the field is absent, not when it is empty (`is defined`, not `|default`).
    seen_in: community-guide theme, code-scanning fix
  - problem: Alt text also appeared as a hover tooltip, so screen readers announced it twice.
    fix: media.html('', alt) passes an empty title.
    seen_in: community-guide theme, v0.2.0
  - problem: Buttons opening a new tab had no rel attribute, leaving window.opener reachable from the linked site.
    fix: cl.link_attrs adds rel="noopener noreferrer" whenever target is _blank.
    seen_in: community-guide theme, v0.2.0
  - problem: Rows were tied to numbered slots in the layout (a "content section ID" select, cid1–cid10), so adding or reordering rows meant editing two places.
    fix: Rows render in list order; drag to reorder.
    seen_in: Gantry 5 info-CTA particle
  - problem: Headings were hard-coded as h2, which broke the outline when rows were placed under another h2.
    fix: heading_level parameter.
    seen_in: community-guide theme, v0.2.0
  - problem: Body text used the code editor field, so editors had no formatting toolbar in Grav 2's Admin.
    fix: type markdown, which Admin2 renders with its markdown editor (and Editor Pro when installed).
    seen_in: Admin2 migration
verify:
  - The page blueprint shows a "Call-to-Action Rows" section with a Rows list (Admin2 or GET /api/v1/blueprints/pages/<template>).
  - Rendering example.md outputs one .cl-cta-rows__row per non-empty row and no empty .cl-cta-rows__media.
  - Every <a target="_blank"> inside .cl-cta-rows has rel="noopener noreferrer".
