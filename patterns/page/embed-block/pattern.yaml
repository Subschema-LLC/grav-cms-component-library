id: page/embed-block
name: Embeds and page scripts
version: 1.0.0
level: page
status: stable
summary: Structured fields for third-party embeds (an iframe by URL with a required title and a shape, or a trusted HTML snippet) and page-only scripts, so embed code and Twig stay out of page content.
use_when:
  - A page needs a booking calendar, video, map from another provider, form or widget.
  - Migrating content that relied on Twig or raw embed code inside Markdown.
avoid_when:
  - The embed appears on every page; use theme/head-scripts or a plugin.
compatibility:
  grav: ['1.7', '2.0']
  tested: ['2.2.11', '1.7.53']
requires:
  patterns: [_shared/macros]
data:
  scope: page.header
  keys:
    embeds:
      type: list
      item:
        title: string (iframe accessible name)
        kind: "iframe | html"
        src: https URL
        aspect: "16:9 | 4:3 | 1:1 | fixed"
        height: int px (fixed)
        html: trusted html
        caption: string
    page_scripts: { type: trusted html }
legacy_keys:
  - key: rezdyembed (and other per-provider "paste the iframe" fields)
    handling: Not read. Copy the iframe's src into an embed of kind iframe and give it a title.
files:
  blueprint: blueprint.yaml
  template: embed-block.html.twig
  example: example.md
apply:
  blueprint: |
    embeds_tab:
      type: tab
      title: Embeds
      import@:
        type: page/embed-block/blueprint
        context: 'plugin://component-library/patterns'
  template: |
    {% include 'patterns/page/embed-block/embed-block.html.twig' %}
    {# before </body>: #}
    {% include 'patterns/page/embed-block/embed-block.html.twig' with { slot: 'scripts' } %}
classes:
  markup: [cl-embeds, cl-embeds__item, cl-embeds__item--iframe, cl-embeds__item--html, cl-embeds__frame, cl-embeds__frame--16x9, cl-embeds__frame--4x3, cl-embeds__frame--1x1, cl-embeds__frame--fixed, cl-embeds__html, cl-embeds__caption]
  slots: [root, item, caption]
solves:
  - problem: Grav 2 runs Twig in page content inside a sandbox (and before 2.0.19 did not run it at all by default), so content that built embeds with Twig printed raw {{ }} or was blocked after migration.
    fix: Embeds are header fields rendered by the template, so no Twig runs in content.
    seen_in: Grav 2 migration
  - problem: Editors pasted whole iframe tags from providers, which Grav's save-time XSS check rejects for anyone but super admins, and which usually lacked a title (an unnamed frame for screen readers) and lazy loading.
    fix: Kind "Embed by URL" stores only an https URL; the template builds the iframe with a required title, loading="lazy" and a referrer policy. Any editor can use it.
    seen_in: Gantry tour pages (booking-calendar iframe field)
  - problem: Embedded videos and calendars had fixed pixel sizes and overflowed on phones.
    fix: Shape classes using aspect-ratio, or a fixed height for calendars and forms. No style attributes, so a strict CSP stays possible.
  - problem: Page-specific scripts were pasted into the content, mixing code with prose.
    fix: page_scripts, printed before </body> through slot 'scripts'.
    seen_in: Gantry default page blueprint (page_scripts)
verify:
  - An embed of kind iframe without an https src is skipped.
  - Every rendered iframe has a non-empty title and loading="lazy".
  - A non-super-admin saving <script> in the HTML snippet gets Grav's XSS error; saving an iframe URL succeeds.
